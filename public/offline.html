<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <title>SignalWarga Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 18px 45px rgb(15 23 42 / 0.1);
        max-width: 480px;
        padding: 28px;
      }

      img {
        display: block;
        height: 48px;
        margin-bottom: 24px;
        width: auto;
      }

      h1 {
        font-size: 26px;
        line-height: 1.2;
        margin: 0;
      }

      p {
        color: #475569;
        font-size: 15px;
        line-height: 1.7;
        margin: 14px 0 0;
      }

      a {
        background: #059669;
        border-radius: 10px;
        color: #ffffff;
        display: inline-flex;
        font-size: 14px;
        font-weight: 700;
        margin-top: 24px;
        padding: 12px 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/signalwarga-horizontal.png" alt="SignalWarga" />
      <h1>Koneksi sedang offline.</h1>
      <p>
        Halaman ini belum bisa dimuat karena jaringan terputus. Coba sambungkan
        internet lagi, lalu buka ulang SignalWarga.
      </p>
      <a href="/">Coba lagi</a>
    </main>
  </body>
</html>
